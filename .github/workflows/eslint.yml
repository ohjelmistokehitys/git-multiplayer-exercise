name: Lint HTML using ESLint

on:
  pull_request:
    branches: [trunk]
    paths:
      - "*.html"
      - "eslint.config.js"
      - "package.json"
      - ".github/workflows/eslint.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npx eslint
