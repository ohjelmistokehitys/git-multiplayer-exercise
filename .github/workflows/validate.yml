name: Validate html using html-validate

on:
  pull_request:
    branches: ["*"]
    paths:
      - "**/*.html"
      - "**/eslint.config.js"
      - "**/package.json"
      - "**/validate.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts"

      - name: Run html-validate
        run: npx -y html-validate src
